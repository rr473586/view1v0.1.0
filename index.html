<!-- ホーム背景 -->
<div class="home-bg" aria-hidden="true">
  <img id="home-bg-img" src="https://images.pexels.com/photos/14644522/pexels-photo-14644522.jpeg" alt="" referrerpolicy="no-referrer" crossorigin="anonymous">
  <canvas id="home-bg-canvas"></canvas>
  <div class="home-bg-overlay"></div>
  <canvas id="aurora3d"></canvas>
</div>

<main class="main">

<!-- ===== ホーム画面文字welcome ===== -->
<div id="tab-home" class="tab-content active">
<div class="home-hero">
  <div class="awwwards-hero">
    

    
    <div class="awwwards-hero-content">
      <div class="hero-greeting-title" data-i18n="home_greeting">welcome</div>
      
      
    </div>
  </div>
</div>
</div>

<!-- ===== 天気 ===== -->
<div id="tab-weather" class="tab-content">
  <div class="section-title" data-i18n="weather_title">天気</div>
  <div class="section-sub" data-i18n="weather_sub">都市名を入力して天気を検索</div>
  <div class="search-row">
    <input class="search-input" id="weather-search-input" type="text" maxlength="100" enterkeyhint="search" autocomplete="off" data-i18n-placeholder="weather_placeholder" placeholder="例: 大阪, London, New York" />
    <button type="button" class="search-btn" data-act="search-weather" data-i18n="weather_search_btn">検索</button>
  </div>
  <div id="weather-search-error" class="error-text"></div>
  <div id="weather-search-wrap" class="weather-search-wrap" hidden>
    <div class="card weather-card" id="weather-search-result">
      <div class="loading-text" data-i18n="loading">読み込み中…</div>
    </div>
  </div>
  <div class="grid-2">
    <div class="card weather-card" id="weather-tokyo">
      <div class="card-title">Tokyo · 東京</div>
      <div class="loading-text" data-i18n="loading">読み込み中…</div>
    </div>
    <div class="card weather-card" id="weather-tsuruoka">
      <div class="card-title">Tsuruoka · 鶴岡</div>
      <div class="loading-text" data-i18n="loading">読み込み中…</div>
    </div>
  </div>
</div>

<!-- ===== 世界時計 ===== -->
<div id="tab-clock" class="tab-content">
  <div class="section-title" data-i18n="clock_title">世界時計</div>
  <div class="section-sub" data-i18n="clock_sub">都市名を検索して追加。ドラッグで並べ替え</div>
  <div class="search-row">
    <input class="search-input" id="clock-search-input" type="text" maxlength="100" enterkeyhint="search" autocomplete="off" data-i18n-placeholder="clock_placeholder" placeholder="例: パリ, Dubai, ロサンゼルス" />
    <button type="button" class="search-btn" data-act="search-clock" data-i18n="clock_search_btn">追加</button>
  </div>
  <div id="clock-search-error" class="error-text"></div>
  <div id="clock-board" class="clock-board"></div>
</div>

<!-- ===== 時間割 ===== -->
<div id="tab-timetable" class="tab-content">
  <div class="section-title" data-i18n="tt_title">時間割</div>
  <div class="section-sub" data-i18n="tt_sub">教科カードを選んでマスをクリックまたはドラッグ</div>

  <div class="tt-palette-wrap card">
    <div class="card-title" data-i18n="tt_palette_title">教科カード</div>
    <div id="tt-palette" class="tt-palette"></div>
    <div class="tt-add-row">
      <input type="text" id="tt-custom-input" class="search-input" maxlength="12" data-i18n-placeholder="tt_custom_placeholder" placeholder="教科名を入力（例: 部活, 自習）" />
      <button type="button" class="search-btn" data-act="tt-add" data-i18n="tt_add_btn">＋ カード追加</button>
    </div>
    <div id="tt-add-error" class="error-text"></div>
    <div id="tt-hint" class="tt-hint"></div>
  </div>


  <div class="tt-grid-scroll">
    <div id="tt-grid" class="tt-grid"></div>
  </div>
</div>

<!-- ===== 提出物・宿題カウントダウン ===== -->
<div id="tab-deadline" class="tab-content">
  <div class="section-title" data-i18n="dl_title">提出物・宿題カウントダウン</div>
  <div class="section-sub" data-i18n="dl_sub">締め切りを登録すると、あと何日か自動で表示されます。締め切りが近い順に並びます。</div>

  <div class="card dl-form-card">
    <div class="card-title" data-i18n="dl_form_title">新しい締め切りを追加</div>
    <div class="dl-form-row">
      <input type="text" id="dl-title-input" class="search-input dl-title-input" maxlength="40" enterkeyhint="done" autocomplete="off" data-i18n-placeholder="dl_title_placeholder" />
      <input type="date" id="dl-date-input" class="dl-date-input" />
    </div>
    <div class="dl-form-row dl-form-actions">
      <div class="dl-quick-row" id="dl-quick-row">
        <button type="button" class="dl-quick-btn" data-act="dl-quick" data-days="0" data-i18n="dl_quick_today">今日</button>
        <button type="button" class="dl-quick-btn" data-act="dl-quick" data-days="1" data-i18n="dl_quick_tomorrow">明日</button>
        <button type="button" class="dl-quick-btn" data-act="dl-quick" data-days="3" data-i18n="dl_quick_3">3日後</button>
        <button type="button" class="dl-quick-btn" data-act="dl-quick" data-days="7" data-i18n="dl_quick_7">1週間後</button>
        <button type="button" class="dl-quick-btn" data-act="dl-quick" data-days="14" data-i18n="dl_quick_14">2週間後</button>
      </div>
      <button type="button" class="search-btn dl-add-btn" data-act="dl-add" data-i18n="dl_add_btn">＋ 追加</button>
    </div>
    <div id="dl-add-error" class="error-text"></div>
  </div>

  <div id="dl-summary" class="dl-summary" hidden></div>

  <div class="dl-toolbar">
    <button type="button" class="dl-clear-expired-btn" data-act="dl-clear-done" data-i18n="dl_clear_done">完了済みを削除</button>
    <button type="button" class="dl-clear-expired-btn" data-act="dl-clear" data-i18n="dl_clear_expired">期限切れを削除</button>
  </div>

  <div id="dl-list" class="dl-list"></div>
</div>

<!-- ===== 設定 (どのタブが表示中でも開閉できるよう、タブコンテンツの外側に配置) ===== -->
<div class="settings-modal-overlay" id="settings-modal-overlay" data-act="overlay">
  <div class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="set-title-main">
    <div class="set-grabber" aria-hidden="true"></div>
    <div class="set-nav">
      <button type="button" class="set-nav-btn set-back" id="set-back" data-act="settings-back" hidden>
        <span class="material-icons">chevron_left</span><span data-i18n="settings_title">設定</span>
      </button>
      <span class="set-nav-spacer"></span>
      <button type="button" class="set-nav-btn set-done" id="set-done" data-act="close-settings" data-i18n="settings_done">完了</button>
    </div>

    <div class="set-pages">
      <!-- メイン -->
      <section class="set-page set-page-main" id="set-page-main">
        <h2 class="set-large-title" id="set-title-main" data-i18n="settings_title">設定</h2>

        <div class="set-group">
          <button type="button" class="set-row" data-act="settings-push" data-page="lang">
            <span class="set-icon" style="--ic:#0a84ff"><span class="material-icons">language</span></span>
            <span class="set-label" data-i18n="settings_lang_title">言語</span>
            <span class="set-value" id="settings-lang-value">日本語</span>
            <span class="material-icons set-chev">chevron_right</span>
          </button>
        </div>

        <div class="set-group">
          <button type="button" class="set-row" id="motion-switch" role="switch" aria-checked="false" data-act="toggle-motion">
            <span class="set-icon" style="--ic:#ff9f0a"><span class="material-icons">animation</span></span>
            <span class="set-label" data-i18n="settings_reduce_motion">アニメーションを減らす</span>
            <span class="ios-switch" aria-hidden="true"><span class="ios-switch-knob"></span></span>
          </button>
        </div>
        <p class="set-footnote" data-i18n="settings_reduce_motion_note">画面の切り替えやボタンの動きを抑えます。</p>
      </section>

      <!-- 言語 -->
      <section class="set-page set-page-lang" id="set-page-lang" aria-hidden="true">
        <h2 class="set-large-title" data-i18n="settings_lang_title">言語</h2>
        <p class="set-footnote set-footnote-top" data-i18n="settings_lang_sub">表示する言語を選択してください。</p>
        <div class="set-group">
          <button type="button" class="set-row lang-option" id="lang-option-ja" data-act="set-lang" data-lang="ja">
            <span class="set-label">日本語</span>
            <span class="material-icons lang-option-check">check</span>
          </button>
          <button type="button" class="set-row lang-option" id="lang-option-en" data-act="set-lang" data-lang="en">
            <span class="set-label">English</span>
            <span class="material-icons lang-option-check">check</span>
          </button>
        </div>
      </section>
    </div>
  </div>
</div>

</main>

<!-- 元に戻す用のトースト -->
<div class="toast" id="toast" role="status" aria-live="polite">
  <span class="toast-msg" id="toast-msg"></span>
  <button type="button" class="toast-btn" id="toast-btn" data-act="toast-action" hidden></button>
</div>


<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/bg.js"></script>
</body>
</html>
